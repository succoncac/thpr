<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Glow Shield -->
  <path d="M256 70 L410 135 C410 280 256 425 256 425 C256 425 102 280 102 135 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round" filter="url(#glow)" opacity="0.6" />

  <!-- Main Shield -->
  <path d="M256 70 L410 135 C410 280 256 425 256 425 C256 425 102 280 102 135 Z"
        fill="rgba(15, 23, 42, 0.85)" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Shackle (Lock Top) -->
  <path d="M216 230 V195 C216 172 234 155 256 155 C278 155 296 172 296 195 V230"
        fill="none" stroke="url(#lockGrad)" stroke-width="20" stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="186" y="225" width="140" height="110" rx="20" fill="url(#lockGrad)" />

  <!-- Keyhole -->
  <circle cx="256" cy="270" r="14" fill="#070a12" />
  <polygon points="251,270 261,270 265,302 247,302" fill="#070a12" />

  <!-- Brand Text TH10 -->
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="32" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">TH10</text>
</svg>
